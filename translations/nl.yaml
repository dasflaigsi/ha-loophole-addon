configuration:
  port:
    name: Lokale HTTP-poort
    description: De HTTP-poort waarop je Home Assistant draait (meestal 80). Gebruik niet de HTTPS-poort (443).
  hostname:
    name: Tunnelhostnaam
    description: Aangepaste hostnaam voor je tunnel. De tunnel-URL wordt https://<hostname>.loophole.site
  verbose:
    name: Gedetailleerde logging
    description: Schakel debug-logging van Loophole CLI in om gedetailleerde tunnelbewerking te zien
