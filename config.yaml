name: Loophole Tunnel
version: "1.0.0"
slug: ha-loophole-addon
description: Home Assistant add-on for loophole.cloud tunneling to expose your HA instance with HTTPS over the public internet.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
homeassistant_api: true
options:
  port: 80
  hostname: ""
  verbose: false
schema:
  port: int(1,65535)
  hostname: str
  verbose: bool
